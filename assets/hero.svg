<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-label="Felipe Martins — Desenvolvedor Fullstack. Sistemas que automatizam processos.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b10"/>
      <stop offset="0.6" stop-color="#10121a"/>
      <stop offset="1" stop-color="#1a1633"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r"><rect width="900" height="290" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="900" height="290" fill="url(#bg)"/>
    <circle cx="760" cy="145" r="230" fill="url(#glow)"/>
    <g stroke="#262a3a" stroke-opacity="0.55" stroke-width="1">
      <path d="M0 48H900M0 96H900M0 144H900M0 192H900M0 240H900"/>
      <path d="M96 0V290M192 0V290M288 0V290M384 0V290M480 0V290M576 0V290M672 0V290M768 0V290M864 0V290"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="899" height="289" rx="22" fill="none" stroke="#262a3a"/>

  <text x="52" y="62" fill="#22d3ee" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.4">OLÁ, EU SOU O FELIPE</text>
  <text x="52" y="124" fill="#e7e9f0" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="50" font-weight="800" letter-spacing="-1.5">Sistemas que</text>
  <text x="52" y="182" fill="url(#t)" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="50" font-weight="800" letter-spacing="-1.5">automatizam rotinas.</text>
  <text x="52" y="222" fill="#9aa1b4" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15">Desenvolvedor Fullstack: Python, Next.js e IA aplicada</text>
  <text x="52" y="244" fill="#9aa1b4" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15">a processos reais, na Reluz Contábil.</text>

  <g transform="translate(676 55)">
    <rect width="170" height="170" rx="42" fill="#0a0b10" stroke="url(#g)" stroke-width="3"/>
    <text x="85" y="106" text-anchor="middle" fill="url(#g)" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="-3">FM</text>
  </g>
</svg>
